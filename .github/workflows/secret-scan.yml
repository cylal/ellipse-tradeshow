name: secret-scan

# OPS-01 — bloque tout commit/PR introduisant un secret, et signale les
# dependances vulnerables. Voir l'audit securite du 12 juin 2026.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet pour scanner les commits

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  npm-audit:
    name: Audit des dependances (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Non bloquant au depart (continue-on-error). Passer a bloquant
      # une fois les vulnerabilites existantes traitees.
      - name: npm audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true
